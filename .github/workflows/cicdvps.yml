# ============================================================
# GITHUB ACTIONS WORKFLOW — CI/CD для KeyLearning
# ============================================================
# Структура пайплайна (3 джобы):
# 1. test-backend    — тесты Kotlin/Gradle (параллельно с фронтом)
# 2. test-frontend   — тесты Node.js/Jest (параллельно с бэком)
# 3. deploy          — сборка, пуш в GHCR, деплой на VPS + healthcheck
#                      (запускается ТОЛЬКО после успешных тестов)
#
# Деплой срабатывает только при push в УКАЗАННУЮ ветку.
# ============================================================

name: CI/CD Pipeline

on:
  # Тесты запускаем при любом push и pull request (в любую ветку)
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./backend/gradlew

      - name: Run backend tests
        run: ./gradlew test
        working-directory: ./backend

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ./frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run frontend tests
        run: npm test
        working-directory: ./frontend

  deploy:
    name: Build, Push & Deploy
    needs: [test-backend, test-frontend]
    # TODO: ВАЖНО: перед мерджем в main замените docker-settings-branch на main
    if: github.event_name == 'push' && github.ref == 'refs/heads/docker-settings-branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Сборка и публикация образов

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build and push Docker images
        run: |
          docker compose build
          docker compose push
        env:
          COMPOSE_PROJECT_NAME: keylearning

      # Проверка: видим ли секретики?

      - name: Debug secrets
        run: |
          echo "SSH_HOST length: ${#SSH_HOST}"
          echo "SSH_USER length: ${#SSH_USER}"
          echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY}"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # Деплой на VPS

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            # Авторизуемся в GitHub Container Registry
            echo "${{ secrets.GHCR_PUSH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /opt/keylearning

            # Создаём docker-compose.yml на сервере
            # (без секции build — образы уже в GHCR)
            cat > docker-compose.yml << 'EOF'
            services:
              db:
                image: mariadb:10.11
                command: --lower-case-table-names=1
                container_name: keylearning-db
                restart: always
                environment:
                  MARIADB_ROOT_PASSWORD: rootpass
                  MARIADB_DATABASE: keyldb
                  MARIADB_USER: user
                  MARIADB_PASSWORD: pass
                volumes:
                  - mariadb_data:/var/lib/mysql
                networks:
                  - keylearning-network
                healthcheck:
                  test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                  start_period: 30s

              backend-migrate:
                image: ghcr.io/${{ github.repository }}/backend:latest
                container_name: keylearning-migrate
                entrypoint: ["java", "-Xms256m", "-Xmx512m", "-cp", "/app/lib/*", "su.itgalley.database.config.migrations.FlywayMigratorKt", "migrate"]
                environment:
                  DB_HOST: db
                  DB_PORT: "3306"
                  DB_NAME: keyldb
                  DB_USER: user
                  DB_PASSWORD: pass
                depends_on:
                  db:
                    condition: service_healthy
                networks:
                  - keylearning-network
                restart: "no"

              backend:
                image: ghcr.io/${{ github.repository }}/backend:latest
                container_name: keylearning-backend
                restart: always
                environment:
                  DB_HOST: db
                  DB_PORT: "3306"
                  DB_NAME: keyldb
                  DB_USER: user
                  DB_PASSWORD: pass
                ports:
                  - "8228:8228"
                depends_on:
                  backend-migrate:
                    condition: service_completed_successfully
                networks:
                  - keylearning-network
                deploy:
                  resources:
                    limits:
                      memory: 512M
                      cpus: '0.5'

              frontend:
                image: ghcr.io/${{ github.repository }}/frontend:latest
                container_name: keylearning-frontend
                restart: always
                ports:
                  - "3000:3000"
                depends_on:
                  backend:
                    condition: service_started
                networks:
                  - keylearning-network
                deploy:
                  resources:
                    limits:
                      memory: 256M
                      cpus: '0.25'

            networks:
              keylearning-network:
                driver: bridge

            volumes:
              mariadb_data:
            EOF

            # Скачиваем свежие образы из GHCR
            docker compose pull

            # Перезапускаем контейнеры с новыми образами
            docker compose up -d

            # Показываем статус контейнеров
            docker compose ps

      # --- Healthcheck после деплоя ---
      # Проверяем, что оба сервиса реально отвечают на запросы.

      - name: Healthcheck after deploy
        run: |
          echo "Waiting 45 seconds for JVM to start..."
          sleep 45

          echo "Checking backend (port 8228)..."
          BACKEND_OK=false
          for i in 1 2 3 4 5; do
            BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SSH_HOST }}:8228/api/navigation || echo "000")
            if [ "$BACKEND_STATUS" = "200" ]; then
              echo "Backend OK (HTTP 200) after attempt $i"
              BACKEND_OK=true
              break
            fi
            echo "Attempt $i: Backend returned HTTP $BACKEND_STATUS, retrying in 10s..."
            sleep 10
          done

          if [ "$BACKEND_OK" = false ]; then
            echo "Backend healthcheck FAILED after 5 attempts"
            exit 1
          fi

          echo "Checking frontend (port 3000)..."
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SSH_HOST }}:3000/ || echo "000")
          if [ "$FRONTEND_STATUS" != "200" ]; then
            echo "Frontend healthcheck FAILED (HTTP $FRONTEND_STATUS)"
            exit 1
          fi
          echo "Frontend OK (HTTP 200)"

          echo "Deploy successful!"